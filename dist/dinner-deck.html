<title>Dinner Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a card table. Deck in the left hand, a green baize week in the middle, the shop as a paper list on the right. */
:root {
  --paper: #F2F6F1; --panel: #FFFFFF; --ink: #16241B; --muted: #4B5E51; --line: #D5DFD5;
  --green: #1F7A4D; --green-ink: #FFFFFF; --felt: #1E5A3F; --felt-deep: #174832; --felt-line: #3C7A5C; --felt-ink: #ECF5EE; --felt-muted: #B5D2C0;
  --deal: #FFFDF6; --deal-ink: #174832; --card: #FFFDF6; --card-ink: #16241B; --card-muted: #55665A; --card-edge: #D9D3BF;
  --rust: #9A3412; --rust-bg: #FFF1E8; --rust-line: #F0C4AA; --rust-ink: #5A2410;
  --sea: #1B6FA8; --chicken: #A86A12; --pork: #B03A63; --lamb: #6A4BA3; --veg: #2E7D32;
  --t0: #C2410C; --t1: #1D6FA5; --t2: #7C3AED; --t3: #B45309; --t4: #0F766E; --t5: #BE185D; --t6: #4D7C0F; --t7: #475569;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 6px 14px -8px rgba(0, 0, 0, .35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1612; --panel: #131D18; --ink: #E7F0E9; --muted: #9DB2A4; --line: #25352B;
    --green: #47B881; --green-ink: #06140D; --felt: #123526; --felt-deep: #0C281C; --felt-line: #2B5E46; --felt-ink: #E3F0E7; --felt-muted: #93B5A1;
    --deal: #47B881; --deal-ink: #06140D; --card: #26362D; --card-ink: #EDF4EE; --card-muted: #A9BBAE; --card-edge: #3D5246;
    --rust: #F2A27C; --rust-bg: #33190F; --rust-line: #6B3620; --rust-ink: #F8CDB6;
    --sea: #6CB8E6; --chicken: #E5B45A; --pork: #F08BAE; --lamb: #B49BEA; --veg: #7CCB80;
    --t0: #FB923C; --t1: #60A5FA; --t2: #C4B5FD; --t3: #FBBF24; --t4: #5EEAD4; --t5: #F9A8D4; --t6: #BEF264; --t7: #CBD5E1;
    --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 8px 16px -8px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1612; --panel: #131D18; --ink: #E7F0E9; --muted: #9DB2A4; --line: #25352B;
  --green: #47B881; --green-ink: #06140D; --felt: #123526; --felt-deep: #0C281C; --felt-line: #2B5E46; --felt-ink: #E3F0E7; --felt-muted: #93B5A1;
  --deal: #47B881; --deal-ink: #06140D; --card: #26362D; --card-ink: #EDF4EE; --card-muted: #A9BBAE; --card-edge: #3D5246;
  --rust: #F2A27C; --rust-bg: #33190F; --rust-line: #6B3620; --rust-ink: #F8CDB6;
  --sea: #6CB8E6; --chicken: #E5B45A; --pork: #F08BAE; --lamb: #B49BEA; --veg: #7CCB80;
  --t0: #FB923C; --t1: #60A5FA; --t2: #C4B5FD; --t3: #FBBF24; --t4: #5EEAD4; --t5: #F9A8D4; --t6: #BEF264; --t7: #CBD5E1;
  --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 8px 16px -8px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
:focus-visible { outline: 3px solid var(--t1); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr) 390px; }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; overscroll-behavior: contain; }

/* ---------- deck ---------- */
.deck { background: var(--paper); border-right: 1px solid var(--line); }
.deck-head { padding: 22px 16px 12px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1 { font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: -.01em; }
.sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.field input { min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--panel); color: var(--ink); font-size: 15px; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.picking { margin: 0 16px 8px max(20px, env(safe-area-inset-left, 0px)); padding: 8px 10px; border-radius: 10px; background: var(--felt); color: var(--felt-ink); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.picking button { border: 0; background: transparent; color: var(--felt-ink); text-decoration: underline; padding: 4px; }
.cards { list-style: none; margin: 0; padding: 2px 16px 24px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 7px; }
.pcard { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 10px; background: var(--card); color: var(--card-ink); border: 1px solid var(--card-edge); border-radius: 10px; box-shadow: 0 2px 0 var(--card-edge); font-weight: 500; font-size: 14px; line-height: 1.25; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.pcard:hover { border-color: var(--green); }
.pcard .nm { flex: 1; min-width: 0; }
.pcard .tags { display: flex; gap: 4px; flex-shrink: 0; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--card-ink) 8%, transparent); color: var(--card-muted); white-space: nowrap; }
.pcard.used { opacity: .55; }
.pcard.used .tag.on { background: var(--green); color: var(--green-ink); opacity: 1; }
.pip { width: 22px; height: 22px; flex-shrink: 0; }
.pip.sea { color: var(--sea); } .pip.chicken { color: var(--chicken); } .pip.pork { color: var(--pork); } .pip.lamb { color: var(--lamb); } .pip.veg { color: var(--veg); }
.empty { padding: 18px 20px; color: var(--muted); font-size: 14px; }

/* ---------- table ---------- */
.table { background: radial-gradient(120% 90% at 50% 0%, var(--felt) 0%, var(--felt-deep) 100%); color: var(--felt-ink); }
.table-head { padding: 20px 24px 10px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav h2 { font-weight: 600; font-size: 21px; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--felt-line); background: transparent; color: var(--felt-ink); display: inline-grid; place-items: center; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: color-mix(in srgb, var(--felt-ink) 10%, transparent); }
.deal { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--felt-line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--felt-muted); padding: 0 10px; min-height: 34px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--felt-ink) 16%, transparent); color: var(--felt-ink); }
.primary { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--deal); color: var(--deal-ink); font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 rgba(0, 0, 0, .28); display: inline-flex; align-items: center; gap: 8px; }
.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
.why { margin: 0 24px 6px; font-size: 13.5px; color: var(--felt-muted); min-height: 19px; }
.days { list-style: none; margin: 0; padding: 4px 24px 8px; display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: stretch; position: relative; }
.day .d { display: flex; flex-direction: column; justify-content: center; font-family: var(--display); line-height: 1.05; }
.day .d b { font-weight: 800; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; }
.day .d span { font-size: 12px; color: var(--felt-muted); }
.slot { min-height: 62px; border-radius: 12px; border: 1.5px dashed var(--felt-line); display: flex; align-items: stretch; position: relative; }
.slot.over { border-color: var(--card); background: color-mix(in srgb, var(--felt-ink) 12%, transparent); }
.slot .open { flex: 1; border: 0; background: transparent; color: var(--felt-muted); font-size: 13.5px; text-align: left; padding: 0 14px; border-radius: 12px; }
.slot .open:hover { color: var(--felt-ink); }
.dcard { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; background: var(--card); color: var(--card-ink); border-radius: 11px; box-shadow: var(--shadow); margin: -1.5px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.dcard.second { background: color-mix(in srgb, var(--card) 78%, var(--felt)); }
.dcard .body { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; color: inherit; }
.dcard .nm { font-weight: 700; font-size: 15px; line-height: 1.2; display: block; }
.dcard .meta { font-size: 12.5px; color: var(--card-muted); display: block; margin-top: 2px; }
.dcard .meta .warn { color: var(--rust); font-weight: 700; }
.threads { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 46%; }
.thread { border: 0; font-size: 11.5px; font-weight: 500; padding: 2px 7px 2px 6px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 14%, transparent); color: var(--card-ink); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.thread::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.tools { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.tool { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--card-muted); display: inline-grid; place-items: center; }
.tool:hover { background: color-mix(in srgb, var(--card-ink) 9%, transparent); color: var(--card-ink); }
.tool[aria-pressed="true"] { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.tool svg { width: 16px; height: 16px; }
.link { position: absolute; left: 20px; top: calc(100% - 6px); height: 20px; z-index: 2; display: flex; align-items: center; }
.link span { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--rust-bg); color: var(--rust-ink); border: 1px solid var(--rust-line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.hl { box-shadow: 0 0 0 2px var(--t3) !important; }
.extras { margin: 2px 24px 0; padding-left: 64px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--felt-muted); min-height: 34px; }
.extras.over { outline: 1.5px dashed var(--card); border-radius: 10px; }
.xchip { display: inline-flex; align-items: center; gap: 4px; background: var(--card); color: var(--card-ink); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; font-weight: 500; }
.xchip button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 50%; color: var(--card-muted); }
.notes { margin: 12px 24px 28px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.notes h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--felt-muted); margin-bottom: 2px; font-family: var(--body); }
.note { font-size: 14px; line-height: 1.4; padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--felt-ink) 8%, transparent); border: 1px solid color-mix(in srgb, var(--felt-ink) 12%, transparent); }
.note b { font-weight: 700; }
.note.chain { background: var(--rust-bg); color: var(--rust-ink); border-color: var(--rust-line); }
.note button { border: 0; background: transparent; color: inherit; text-decoration: underline; text-underline-offset: 2px; padding: 0; font-weight: 500; }

/* ---------- shop ---------- */
.shop { background: var(--panel); border-left: 1px solid var(--line); }
.shop-head { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 10px 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.shop-head .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.shop-head h2 { font-weight: 600; font-size: 21px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 700; }
.saved { color: var(--green); font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .3s ease; }
.addrow { position: relative; }
.addrow input { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--paper); color: var(--ink); }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; }
.suggest button { width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 8px; }
.suggest button:hover, .suggest button.cur { background: var(--paper); }
.suggest small { color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.switch input { width: 18px; height: 18px; accent-color: var(--green); margin: 0; }
.list { padding: 6px max(20px, env(safe-area-inset-right, 0px)) 20px 20px; }
.aisle { margin-top: 14px; }
.aisle-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--green); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.aisle-h span { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.items { list-style: none; margin: 0; padding: 0; }
.item { border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.item .main { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.item input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--green); flex-shrink: 0; }
.item .more { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 6px 0; display: flex; align-items: center; gap: 3px 6px; flex-wrap: wrap; }
.item .more .nm { margin-right: 2px; }
.item .nm { font-weight: 500; }
.item .qty { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; text-align: right; max-width: 46%; }
.item.done .nm { text-decoration: line-through; color: var(--muted); }
.item.done .qty { opacity: .6; }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.badge.share { color: var(--rust); background: var(--rust-bg); display: inline-flex; align-items: center; gap: 4px; }
.badge.share::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tc, var(--rust)); }
.badge.weekly { color: var(--muted); background: var(--paper); }
.badge.odd { color: var(--rust); border: 1px solid var(--rust-line); }
.item .x { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; }
.detail { font-size: 12.5px; color: var(--muted); padding: 0 0 8px 30px; line-height: 1.45; }
.detail .product { display: block; }
details.cupboard { margin-top: 16px; }
details.cupboard summary { font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 0; cursor: pointer; }
.shop-foot { padding: 12px max(20px, env(safe-area-inset-right, 0px)) 16px 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.shop-more { padding: 4px max(20px, env(safe-area-inset-right, 0px)) 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.shop-more .ghost { min-height: 38px; font-size: 13.5px; }
.after { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.go { flex: 1; min-height: 44px; border: 0; border-radius: 12px; background: var(--green); color: var(--green-ink); font-weight: 700; }
.ghost { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-weight: 500; }
.fine { font-size: 12px; color: var(--muted); }

/* ---------- sheet ---------- */
dialog { border: 0; padding: 0; border-radius: 16px; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: min(86vh, 760px); box-shadow: 0 24px 60px -12px rgba(0, 0, 0, .5); }
dialog::backdrop { background: rgba(8, 20, 14, .55); }
.sheet { display: flex; flex-direction: column; max-height: inherit; }
.sheet-head { padding: 20px 20px 12px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 22px; font-weight: 800; line-height: 1.1; flex: 1; }
.sheet-head .pip { width: 30px; height: 30px; margin-top: 1px; }
.close { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
.sheet-body { padding: 14px 20px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-body h3 { font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--green); }
.sheet-body p { margin: 0; max-width: 65ch; }
.ing { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 14.5px; }
.ing .q { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.ing .n small { color: var(--muted); }
.ing .sec { grid-column: 1 / -1; font-weight: 700; margin-top: 6px; font-size: 13px; }
.method { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; max-width: 65ch; }
.puton { display: flex; flex-wrap: wrap; gap: 6px; }
.puton button { min-width: 48px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; font-family: var(--display); font-size: 13.5px; padding: 0 10px; }
.puton button:hover { border-color: var(--green); }
.puton button.here { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: 18px; }
.stepper output { min-width: 2ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet-foot { padding: 12px 20px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
a { color: var(--green); }
.dest { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.dest li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 14px; }
.dest b { display: block; }
.dest small { color: var(--muted); }
.status { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--rust-bg); color: var(--rust-ink); border: 1px solid var(--rust-line); }
.status.ok { background: color-mix(in srgb, var(--green) 12%, var(--panel)); color: var(--ink); border-color: color-mix(in srgb, var(--green) 40%, var(--panel)); }
textarea.copy { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: 12.5px/1.45 ui-monospace, 'SF Mono', Menlo, monospace; padding: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

:"3ad8f66a-09e5-4686-8ea1-5c51036f4474","q":1.0,"t":"wedges","h":"Mussels"},{"g":"c13c1d5f-d5ef-4a54-9cd0-285f6601c681","q":2.0,"t":"cut into florets","h":"Sides"},{"g":"69ae34d6-cf6f-48f0-a334-8a671f4ec2ce","q":1.0,"t":"baguette or ciabatta","h":"Sides"}],"d":"Green-lipped mussels in a garlic, white wine and parmesan cream sauce, with steamed broccoli and crusty bread. About 25 minutes.","m":"1. **Prep the mussels.** Scrub the mussels and pull off the beards. Throw out any with cracked shells or that stay open when tapped.\n2. **Warm the bread.** Heat the oven to 180°C and warm the bread for 8 to 10 min while you cook.\n3. **Soften the aromatics.** Melt the butter in a large lidded pot on medium. Cook the shallots 3 min until soft, then add the garlic for 1 min without browning.\n4. **Steam the mussels.** Pour in the wine, turn the heat to high and add the mussels. Cover and cook 4 to 5 min, shaking the pot once or twice, until the shells open.\n5. **Steam the broccoli.** Meanwhile, steam the broccoli 4 to 5 min until just tender.\n6. **Make the sauce.** Lift the mussels into a warm bowl with a slotted spoon, discarding any that stay shut. Add the cream to the pot juices and simmer 3 min until slightly thickened.\n7. **Finish.** Off the heat, stir in the parmesan and pepper. Taste before salting, as the mussel juices are already salty. Return the mussels, toss through the sauce and scatter with parsley.\n8. **Serve.** Serve in bowls with the broccoli, lemon wedges and sliced bread for mopping up the sauce.\n\n# Notes\n\n- Low-carb serves skip the bread and take extra broccoli.\n- Lifting the mussels out before reducing the cream stops them going rubbery.\n- About 500 g of mussels in the shell per person."},"6eab4c3d-6374-4fe4-b1f2-ca558441c213":{"n":"Crock pot Mediterranean chicken with olives","sv":4,"k":"dinner","pr":"chicken","i":[{"g":"0a9a0f65-c261-4b6e-812a-a728c67cd0d4","q":860.0,"t":"4 cutlets"},{"g":"5a58e1e6-c78d-4e3b-ac5b-964350dfdb0d","q":1.5,"t":"smoked or sweet"},{"g":"7547d300-51af-4421-9f0d-ef7c63a97088","q":0.75,"u":"tsp"},{"g":"934ca8b1-071f-4f03-a652-ba1a6fde0cfa","q":0.5},{"g":"8913328f-8bee-4005-b211-bd336d01e158","q":1.0,"u":"tbsp"},{"g":"284d9e7f-e8d5-46a5-8555-21fe0f46935e","q":4.0,"t":"halved"},{"g":"fb82994f-94b5-453a-bfde-697dbf07517e","q":5.0,"t":"smashed"},{"g":"382ab270-73f6-430c-9033-9d6bd040abef","q":1.0,"t":"400 g"},{"g":"d1b4b54d-96af-4690-83f5-f2319ed87d12","q":1.0,"u":"tsp"},{"g":"b75aeadb-fc8a-45e9-b861-e39858e4bccd","q":0.75,"u":"tsp"},{"g":"65055618-512c-48ae-83d1-e97ea7ce526a","q":0.5,"u":"tsp","t":"crushed"},{"g":"67bd8bbf-2531-498f-9a27-8a3a5588f681","q":1.0,"u":"pinch","o":1},{"g":"40aa6841-d4c1-4f83-9720-ac97ed5d2d2d","q":0.5},{"g":"3ad8f66a-09e5-4686-8ea1-5c51036f4474","q":0.5,"t":"juiced, or a splash of vinegar"}],"d":"Bone-in chicken thighs braised in garlicky tomato, olives and herbs. About 15 min prep, then 3 hours on HIGH. Low carb, mild.","m":"1. **Season.** Rub the chicken with paprika, salt and pepper.\n2. **Sear skin side.** Heat the oil in a pan and brown the chicken skin-side down until golden, about 7 min. Skip if pushed for time, but it's the biggest flavour win.\n3. **Build the base.** Tip shallots, garlic, tomatoes, oregano, thyme, rosemary and chilli into the crock pot. Stir. Sit the chicken on top, skin up, so the skin stays out of the sauce.\n4. **Cook.** Lid on, HIGH for 2.5 to 3 hours, until the meat pulls easily from the bone.\n5. **Add olives.** Stir into the sauce for the last 20 min so they warm through without going mushy.\n6. **Finish.** Stir in the lemon juice and taste for salt. For crisp skin, 3 min under a hot grill.\n\n# Notes\n\n- No extra liquid needed.\n- If the sauce is thin, lift the chicken out and run the crock pot uncovered on HIGH for 15 min.\n- One cutlet each is a modest serve for four adults. Go generous on cauliflower mash or green beans to keep it low carb.","tg":["slow"]},"ef39a3a1-dadf-44bd-b0ae-77f162865aab":{"n":"Dad's potato bake","  cabbage.** Core the cabbage (cut a cone around the stem with a paring knife, ~5cm deep, twist out). Place core-side down in a large pot of simmering water. As outer leaves soften, peel them off and lay on a tea towel. Trim the thick rib at the base of each leaf. Keep the dark outer leaves for lining the pot.\n2. **Cook the rice halfway.** Cook for about half the time on the packet — semi-cooked only, it finishes inside the rolls. Cool.\n3. **Sauté the onion.** Finely chop the onion and sauté in the butter until translucent. Cool slightly.\n4. **Make the filling.** Combine pork mince, cooled rice, sautéed onion, crushed garlic, chopped parsley, marjoram, paprika, salt and black pepper. Mix well with your hands.\n5. **Roll.** A generous spoonful of filling on each leaf, fold the sides in, roll up firmly like a burrito. One parcel per leaf. Place seam-side down.\n6. **Line the pot.** Line a heavy pot or Dutch oven with the reserved dark outer cabbage leaves to stop the rolls catching and to keep steam in.\n7. **Pack and cook.** Pack the rolls in seam-side down, snugly in layers. Dissolve the stock cube in ~2 cups boiling water, then pour over with the tin of chopped tomatoes and all the passata. Liquid should nearly cover the rolls. Bring to a gentle simmer on the stove, cover, then either simmer 45-50 min or transfer to a 180°C oven for 60 min.\n8. **Finish the sauce.** Lift the rolls out carefully with a slotted spoon onto a warm plate; cover loosely with foil. Put the pot back on medium-high heat, uncovered, and let the cooking liquid bubble and reduce for 5-10 minutes until glossy and spoonable, stirring occasionally so the bottom doesn't catch. Taste and adjust seasoning.\n9. **Serve.** Plate over mashed potatoes with the sauce spooned over."},"cf99d6a1-a42c-48ad-8fb9-9b48494bef45":{"n":"Ham and cheese sandwiches","sv":4,"k":"lunch","pr":"pork","i":[{"g":"23d9e53f-058d-4160-8e79-06a663cc8ebb","q":1.0,"odd":1},{"g":"24551901-9987-4dc5-a92c-18f3eb4c515d","q":1.0,"o -44af-95f0-ccc1a561a6da","q":700.0},{"g":"36759044-9f60-4fd8-994f-47bba6eef47d","q":1.0}]},"03d5eea3-5886-4c71-ac37-980d7cf40a84":{"n":"Mild chicken, kumara and coconut curry","sv":4,"k":"dinner","pr":"chicken","i":[{"g":"f70150ef-c15d-45e3-81cf-be1701f2f71f","q":2.0,"t":"medium grain white","h":"Rice"},{"g":"8913328f-8bee-4005-b211-bd336d01e158","q":1.0,"u":"tbsp","h":"Curry"},{"g":"616514d1-2934-495b-8e95-31cc701d6089","q":2.0,"t":"diced","h":"Curry"},{"g":"6c9265c8-039c-49ab-bfa1-298acff889f4","q":2.0,"t":"Mrs Rogers","h":"Curry"},{"g":"e0c10600-1a3d-4847-ac54-b20bee399e53","q":1.0,"h":"Curry"},{"g":"d5fbf40f-4613-4433-9dfe-fc51f7bc4b3e","q":1.0,"h":"Curry"},{"g":"b0d535e6-1d44-4170-898e-25a4de074b0e","q":1.0,"h":"Curry"},{"g":"81711ff0-5fee-41e0-8348-749ad2a4edca","q":1.0,"h":"Curry"},{"g":"5a58e1e6-c78d-4e3b-ac5b-964350dfdb0d","q":1.0,"h":"Curry"},{"g":"7547d300-51af-4421-9f0d-ef7c63a97088","q":1.0,"u":"tsp","h":"Curry"},{"g":"dea7391d-9143-4379-b710-8e03a194792d","q":1.0,"t":"peeled, 2cm cubes","h":"Curry"},{"g":"bdc896d0-12cb-46a6-b36f-385badae5fa6","q":200.0,"t":"about 2, sliced","h":"Curry"},{"g":"afeb9bfa-ab9f-4e65-9f15-b025cfeab264","q":400.0,"h":"Curry"},{"g":"103950ec-95cc-4a7d-a2cd-57a8dd4fce90","q":650.0,"t":"bite-size pieces","h":"Curry"},{"g":"8876baa3-dd61-489a-902c-a9e7bc8a6320","q":1.0,"t":"chunks","h":"Curry"},{"g":"81287ff1-fdfc-4b04-8755-e6850f3da671","q":1.0,"t":"to finish","h":"Curry"},{"g":"6b2b618c-3cfc-495b-9c70-be2c206e97ee","q":15.0,"t":"or juice of half a lime","h":"Curry"}],"d":"Quick one-pot mild curry with chicken breast, kumara, carrot and capsicum in coconut cream, served on rice. About 35 minutes.","m":"1. **Start the rice.** Rinse the rice and put in a pot with 600 ml water. Bring to the boil, cover, turn to lowest heat and cook 15 min. Turn off and leave covered.\n2. **Soften onions.** Heat the oil in a large pan on medium. Cook the onions 5 min until soft and golden.\n3. **Toast spices.** Add curry powder, cumin, coriander, garlic powder, ginger, paprika and salt. Stir 1 min. Add a splash of water if it sticks.\n4. **Simmer the veg.** Add kumara, carrots, coconut cream and 250 ml water. Bring to a simmer, cover and cook 8 min.\n5. **Add chicken and capsicum.** Stir in and simmer uncovered 10 min until the chicken is cooked through and the sauce thickens.\n6. **Finish.** Off the heat, stir in the garam masala and lime juice. Taste and adjust salt. Serve over the rice.\n\n# Notes\n\n- Taste a pinch of the curry powder first. If it has heat, use 1 tsp and 2 tsp each of cumin and coriander.\n- 650 g chicken is about two large breasts.","tg":["one-pot"]},"7c3a381d-f2cc-4fa4-805d-e26fec3b1df4":{"n":"Mr Bakeman spiced lemonade","sv":4,"k":"drink","pr":"veg","i":[{"g":"d427aacf-488a-46ed-a342-8d8a126fa8eb","h":"Syrup"},{"g":"3ad8f66a-09e5-4686-8ea1-5c51036f4474","t":"fresh, sliced","h":"Syrup"},{"g":"60757b95-27ea-43bf-8f7c-7898e5ab6b69","h":"Spice mix tea bag"},{"g":"b70f1216-297c-461e-83de-529337ae87c3","h":"Spice mix tea bag"},{"g":"d5fbf40f-4613-4433-9dfe-fc51f7bc4b3e","h":"Spice mix tea bag"},{"g":"5cc72d0a-33dc-4dac-b23a-052239568078","h":"Spice mix tea bag"},{"g":"ca32e60b-f22e-4e88-a0fb-afd9978bda48","o":1,"t":"or water","h":"To serve"}],"d":"Lemon sugar syrup brewed with a spice tea bag, served with soda water or water, hot or cold.","m":"1. **Brew the syrup.** Brew sugar syrup with the sliced lemons and the spice mix tea bag.\n2. **Serve.** Ladle spoons of syrup into a glass to taste. Top with soda water or water, hot or cold."},"4047e157-fcfd-44db-a12f-f7957f1108de":{"n":"One-pot mild Shin noodles with chicken","sv":4,"k":"dinner","pr":"chicken","i":[{"g":"6be80510-276b-473c-a6eb-21fa69fcc8b2","q":4.0,"h":"Noodles"},{"g":"103950ec-95cc-4a7d-a2cd-57a8dd4fce90","q":400.0,"t":"stir fry strips","h":"Chicken"},{"g":"09f19c4a-7821-4fab-bb52-b023fe18abda","q":0.25,"u":"head","t":"large, roughly chopped","h":"Veg"},{"g":"c13c1d5f-d5ef-4a54-9cd0-285f6601c681","q":1.0,"t":"medium, small florets","h":"Veg"},{"g":"616514d1-2934-495b-8e95-31cc701d6089","q":1.0,"t":"sliced, or 2 shallots","h":"Veg"},{"g":"8876baa3-dd61-489a-902c-a9e7bc8a6320","q":1.0,"t":"red, sliced","h":"Veg"},{"g":"23195e13-77df-458a-9332-8ea303692260","q":1.0,"h":"Veg"},{"g":"75032e9a-20d6-4833-8ed3-af196c4d1dd8","q":1.0,"t":"frozen, shelled","h":"Veg"},{"g":"f7023f05-ad96-4865-b9e7-dc263499a463","q":1.0,"o":1,"t":"or veg stock","h":"Optional"},{"g":"73a44e0a-028e-4ede-a663-4c5decbb8442","q":1.0,"o":1,"h":"Optional"},{"g":"80ebbc1c-70b8-44b5-a64e-8faf82aeb5aa","q":4.0,"u":"whole","o":1,"h":"Optional"}],"d":"Family-friendly Shin Ramyun with the heat turned right down, chicken and a pile of veg. One pot, about 15 minutes.","x":["2 l water","1/2 soup powder sachet _(from the noodle packs)_"],"m":"1. **Boil the water.** Bring 2 l water to the boil in your biggest pot. Chop the veg while you wait.\n2. **Cook the chicken and fresh veg.** Add the chicken strips, stirring to separate them, then the cabbage, broccoli, onion and capsicum, plus the dried vegetable sachets from all the packs (these are not spicy). Bring back to the boil and cook 2 min.\n3. **Add noodles and frozen veg.** Add the noodle blocks, corn and edamame. Boil 4 min, loosening the noodles with a fork as they soften. If using eggs, crack them in for the last 2 min and leave them alone to poach.\n4. **Check the chicken.** Cut the biggest piece in half. It should be white all the way through. If not, boil 1 to 2 min more.\n5. **Season gently.** Take off the heat. Stir in half of one soup sachet, then crumble in the stock cube and add the soy sauce to make up the flavour. Taste, and add a little more soup powder only if everyone is coping.\n6. **Serve.** Ladle into bowls. Put the leftover soup sachets on the table so anyone who wants heat can stir extra into their own bowl.\n\n# Notes\n\n- Half a sachet across the whole pot gives flavour with barely any heat. One full sachet is mild-to-medium.\n- If a bowl is still too spicy, a slice of cheese melted on top or a splash of milk calms it down.\n- Veg amounts are flexible, so use what you have.\n- With chicken in the pot the eggs are less needed, so skip them if you like.","tg":["one-pot"]},"89880bea-290b-4b7d-9798-f09bf3a8c186":{"n":"Pikelets","sv":4,"k":"breakfast","pr":"veg","i":[{"g":"80ebbc1c-70b8-44b5-a64e-8faf82aeb5aa","q":1.0},{"g":"a91633a4-a6e2-4c5d-a9ae-c2c682247020","q":1.0},{"g":"575046e9-30bb-478d-b01b-6ae7d1b71f50","q":1.0,"odd":1},{"g":"7547d300-51af-4421-9f0d-ef7c63a97088","q":1.0}]},"58b409fd-4534-4267-b248-f08bdad8c5bd":{"n":"Pizza","sv":4,"k":"dinner","pr":"veg","i":[{"g":"23afee95-a509-422d-bb54-9f3603a663ea"},{"g":"aadaf8ce-e32f-4849-86ac-f475e1d27179"},{"g":"c7e67313-af57-46f2-aaf6-1e421de556c0"},{"g":"23d9e53f-058d-4160-8e79-06a663cc8ebb"},{"g":"94d2c849-6e4e-4618-a40a-a65335c42cbc"},{"g":"40aa6841-d4c1-4f83-9720-ac97ed5d2d2d"},{"g":"98d1cfd4-4095-417d-b693-a501ba7fd27a"},{"g":"cb12c77e-9cc9-42d3-a017-2cb8a80aa8ba"}]},"dbeedae5-2033-478c-b89d-37eec2d1d6aa":{"n":"Pork loin with buckwheat and mushroom sauce","sv":4,"k":"dinner","pr":"pork","i":[{"g":"c13c1d5f-d5ef-4a54-9cd0-285f6601c681","q":1.0},{"g":"7d10cf11-9af4-4791-b44c-dd583d6b46b8","q":1.0},{"g":"7adab3a7-2b06-44e4-bb71-1c02a2c7b0a9","q":250.0},{"g":"0fac1197-f3c5-48ba-ba0a-be5a3469a200","q":1.0},{"g":"89957462-2ee2-4b93-bdcc-4ea9047814b8","q":2.0},{"g":"ed19fe6f-9eac-4c62-ac8c-dc696e7b698b","q":125.0}]},"3a368ea6-e838-44d8-83ad-8a25b0992fbd":{"n":"Porridge","sv":4,"k":"breakfast","pr":"veg","i":[{"g":"29b4f127-cc3c-46fa-990a-42ba1108de57","q":1.0},{"g":"575046e9-30bb-478d-b01b-6ae7d1b71f50","q":1.0,"odd":1},{"g":"0bbd8c05-cd43-4051-a5ab-e0d6f1491c73","q":0.5}]},"a70f9b6c-eaa6-46a4-9d4f-f1bc6ad896dd":{"n":"Prawn curry rice","sv":4,"k":"dinner","pr":"sea","i":[{"g":"abf834ca-3117-48a3-9cc6-55e813189c3d","o":1},{"g":"c13c1d5f-d5ef-4a54-9cd0-285f6601c681","o":1},{"g":"4522f3a7-0de2-4bec-bfed-cd6ca4db6631"},{"g":"fb82994f-94b5-453a-bfde-697dbf07517e"},{"g":"616514d1-293 <script type="module">
// Dinner Deck engine. Pure functions over the deck data; no DOM.
// A week is { start:'YYYY-MM-DD' (a Saturday), days:[7 x slot], extras:[recipeId], adds:[{g,q}], everyWeek:bool }
// A slot is { r: recipeId|null, d: diners|null, lock: bool, second: bool } (second = second night of a batch cook).

const DAY_NAMES = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const DAY_SHORT = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const COUNTABLE = new Set(['can', 'head', 'whole', 'punnet', 'bottle', 'loaf', 'packs']);
const PLURAL = { can: 'cans', head: 'heads', cup: 'cups', piece: 'pieces', punnet: 'punnets', bottle: 'bottles', loaf: 'loaves', bar: 'bars', slice: 'slices', cube: 'cubes', handful: 'handfuls', splash: 'splashes', sprinkle: 'sprinkles', pinch: 'pinches', pack: 'packs' };

function emptyWeek(start) {
  return { start, days: Array.from({ length: 7 }, () => ({ r: null, d: null, lock: false, second: false })), extras: [], adds: [], everyWeek: true };
}

// The Saturday that starts the shopping week containing or following `date`.
function weekStart(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + ((6 - d.getUTCDay() + 7) % 7));
  return d.toISOString().slice(0, 10);
}

function dayDate(start, i) {
  const d = new Date(start + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + i);
  return d;
}

function rangeLabel(start) {
  const a = dayDate(start, 0), b = dayDate(start, 6);
  const sameMonth = a.getUTCMonth() === b.getUTCMonth();
  return `${a.getUTCDate()}${sameMonth ? '' : ' ' + MONTHS[a.getUTCMonth()]} to ${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]} ${b.getUTCFullYear()}`;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FRACTIONS = [[0.25, '¼'], [0.5, '½'], [0.75, '¾'], [1 / 3, '⅓'], [2 / 3, '⅔']];
function formatNumber(q) {
  const whole = Math.floor(q + 1e-9), rest = q - whole;
  if (rest < 0.01) return String(whole);
  const f = FRACTIONS.find(([v]) => Math.abs(v - rest) < 0.02);
  if (f) return (whole ? whole : '') + f[1];
  return String(Math.round(q * 10) / 10);
}

function formatQty(q, unit) {
  if (unit === 'g' && q >= 1000) return formatNumber(q / 1000) + ' kg';
  if (unit === 'ml' && q >= 1000) return formatNumber(q / 1000) + ' l';
  const n = formatNumber(q);
  if (!unit || unit === 'unit') return n;
  if (unit === 'g' || unit === 'ml' || unit === 'kg' || unit === 'tsp' || unit === 'tbsp') return `${n} ${unit}`;
  return `${n} ${q > 1 && PLURAL[unit] ? PLURAL[unit] : unit}`;
}

function makeEngine(deck) {
  const G = deck.groceries, R = deck.recipes;
  const recipeIds = Object.keys(R);
  const dinners = recipeIds.filter((id) => R[id].k === 'dinner');
  const unitOf = (ing) => ing.u || G[ing.g].u;
  // What a recipe needs from another night: groceries named "Leftover ..." whose source recipe is known.
  const needs = {};
  for (const id of recipeIds) {
    const from = R[id].i.map((ing) => G[ing.g].from).filter(Boolean);
    if (from.length) needs[id] = from[0];
  }
  const feeds = {};
  for (const [id, src] of Object.entries(needs)) feeds[src] = id;

  // ---- habits, from the saved plans -------------------------------------------------------
  const planned = {}, byDay = DAY_NAMES.map(() => ({}));
  for (const p of deck.plans) p.days.forEach((id, i) => {
    planned[id] = (planned[id] || 0) + 1;
    byDay[i][id] = (byDay[i][id] || 0) + 1;
  });
  const habits = byDay.map((counts, day) => {
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return top && top[1] >= 2 ? { day, r: top[0], n: top[1], of: deck.plans.length } : null;
  });

  // ---- the shop ---------------------------------------------------------------------------
  function sources(week) {
    const out = [];
    const onBoard = new Set(week.days.filter((s) => s.r && !s.second).map((s) => s.r));
    week.days.forEach((slot, day) => {
      if (!slot.r || slot.second || !R[slot.r]) return;
      const r = R[slot.r];
      out.push({ key: 'd' + day, day, r: slot.r, label: r.n, scale: (slot.d || r.sv) / r.sv });
    });
    week.extras.forEach((id, i) => R[id] && out.push({ key: 'x' + i, day: null, r: id, label: R[id].n, scale: 1 }));
    return { list: out, onBoard };
  }

  function shop(week) {
    const { list, onBoard } = sources(week);
    const lines = new Map();
    const line = (g) => {
      if (!lines.has(g)) lines.set(g, { g, name: G[g].n, aisle: G[g].a, product: G[g].p || '', parts: [], sums: {}, some: false, odd: [], days: [], notes: [] });
      return lines.get(g);
    };
    const fromFridge = [];
    for (const src of list) {
      for (const ing of R[src.r].i) {
        const g = G[ing.g];
        if (g.l) {
          const made = g.from && onBoard.has(g.from);
          fromFridge.push({ g: ing.g, name: g.n, day: src.day, r: src.r, made: !!made, from: g.from || null });
          continue;
        }
        const l = line(ing.g), unit = unitOf(ing);
        const part = { src: src.key, day: src.day, label: src.label, unit, opt: !!ing.o };
        if (ing.q != null && !ing.odd) {
          part.q = ing.q * src.scale;
          l.sums[unit] = (l.sums[unit] || 0) + part.q;
        } else {
          l.some = true;
          if (ing.odd) l.odd.push(`${src.label} says ${formatQty(ing.q, unit)}`);
        }
        if (ing.alt) l.notes.push('or ' + G[ing.alt].n.toLowerCase());
        l.parts.push(part);
        if (src.day != null && !l.days.includes(src.day)) l.days.push(src.day);
      }
    }
    for (const l of lines.values()) {
      l.tier = G[l.g].s ? 'cupboard' : 'meals';
      l.optional = l.parts.every((p) => p.opt);
    }
    if (week.everyWeek) for (const item of deck.everyWeek) {
      const existed = lines.has(item.g), l = line(item.g);
      if (!existed) l.tier = 'weekly';
      l.weekly = { q: item.q ?? null, unit: item.u || '', note: item.t || '' };
    }
    for (const add of week.adds) {
      if (!G[add.g]) continue;
      const existed = lines.has(add.g), l = line(add.g);
      if (!existed) l.tier = 'added';
      l.added = { q: add.q || 1 };
    }
    const all = [...lines.values()].sort((a, b) => a.aisle - b.aisle || a.name.localeCompare(b.name));
    for (const l of all) l.qty = qtyText(l);
    return { lines: all, fromFridge };
  }

  // What to show on the list: meal quantities and the every-week amount added together where the units agree.
  function qtyText(l) {
    const sums = { ...l.sums };
    if (l.weekly && l.weekly.q != null) {
      const u = l.weekly.unit || (G[l.g].u === 'unit' ? 'unit' : '');
      sums[u] = (sums[u] || 0) + l.weekly.q;
    }
    if (l.added) { const u = G[l.g].u === 'unit' ? 'unit' : ''; sums[u] = (sums[u] || 0) + l.added.q; }
    const bits = Object.entries(sums).map(([u, q]) => (u === '' ? `${formatNumber(q)} ${q === 1 ? 'pack' : 'packs'}` : formatQty(q, u)));
    if (!bits.length) return '';
    return bits.join(' + ') + (l.some ? ' + some' : '');
  }

  // ---- what the list alone hides ----------------------------------------------------------
  function insights(week, shopResult) {
    const s = shopResult || shop(week);
    const mealLines = s.lines.filter((l) => l.tier === 'meals' && l.parts.length);
    const shared = mealLines.filter((l) => l.days.length >= 2).sort((a, b) => b.days.length - a.days.length || a.name.localeCompare(b.name));
    const chains = [], warnings = [];
    week.days.forEach((slot, day) => {
      if (!slot.r || slot.second) return;
      const src = needs[slot.r];
      if (!src) return;
      const at = week.days.findIndex((x) => x.r === src && !x.second);
      if (at === -1) warnings.push({ day, r: slot.r, needs: src, why: 'missing' });
      else if (at > day) warnings.push({ day, r: slot.r, needs: src, why: 'order', at });
      else chains.push({ from: at, to: day, source: src, r: slot.r });
    });
    const batches = [];
    week.days.forEach((slot, day) => {
      if (slot.r && !slot.second && R[slot.r].b) {
        const second = week.days.findIndex((x, i) => i > day && x.second && x.r === slot.r);
        batches.push({ day, r: slot.r, second });
      }
    });
    const inside = [];
    week.days.forEach((slot, day) => {
      if (slot.r && !slot.second) for (const inner of R[slot.r].in || []) inside.push({ day, r: slot.r, inner });
    });
    const onBoard = new Set(week.days.map((x) => x.r).filter(Boolean));
    const loose = [];
    for (const l of mealLines) {
      if (l.some) continue;
      for (const [unit, q] of Object.entries(l.sums)) {
        if (!COUNTABLE.has(unit)) continue;
        const left = Math.ceil(q - 1e-9) - q;
        if (left < 0.2) continue;
        const uses = dinners.filter((id) => !onBoard.has(id) && !needs[id] && R[id].i.some((ing) => ing.g === l.g && !ing.o));
        loose.push({ g: l.g, name: l.name, left, unit, uses });
      }
    }
    const habitNotes = [];
    week.days.forEach((slot, day) => {
      const h = habits[day];
      if (h && slot.r === h.r) habitNotes.push({ day, r: h.r, n: h.n, of: h.of, kept: true });
    });
    const flagged = s.lines.filter((l) => l.odd.length);
    return { shared, chains, warnings, batches, inside, loose, habitNotes, flagged, fromFridge: s.fromFridge };
  }

  function stats(week, shopResult) {
    const s = shopResult || shop(week);
    const buy = s.lines.filter((l) => l.tier !== 'cupboard');
    const meals = s.lines.filter((l) => l.tier === 'meals');
    // How many lines the meals would need if nothing were shared.
    const unshared = meals.reduce((n, l) => n + Math.max(1, new Set(l.parts.map((p) => p.src)).size), 0);
    return { items: buy.length, mealItems: meals.length, saved: unshared - meals.length, aisles: new Set(buy.map((l) => l.aisle)).size, cupboard: s.lines.length - buy.length };
  }

  // ---- the dealer -------------------------------------------------------------------------
  const STYLES = { usual: 'The usual', thrifty: 'Thrifty', wild: 'Wildcard' };

  function deal(week, style = 'usual', rng = Math.random) {
    const locked = week.days.map((s) => (s.lock && s.r ? { ...s } : null));
    const taken = new Set(locked.filter(Boolean).map((s) => s.r));
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    let best = null;
    const tries = 120;
    for (let t = 0; t < tries; t++) {
      const days = locked.map((s) => s || { r: null, d: null, lock: false, second: false });
      const used = new Set(taken);
      const free = () => days.map((s, i) => (s.r ? -1 : i)).filter((i) => i >= 0);
      // A leftover chain goes on consecutive days, cook first.
      const chainSources = Object.keys(feeds).filter((id) => !used.has(id) && !used.has(feeds[id]));
      if (chainSources.length && rng() < (style === 'thrifty' ? 0.8 : 0.45)) {
        const src = pick(chainSources);
        const spots = free().filter((i) => i < 6 && !days[i + 1].r);
        if (spots.length) {
          const weekend = spots.filter((i) => i <= 1);
          const i = weekend.length && rng() < 0.7 ? pick(weekend) : pick(spots);
          days[i].r = src; days[i + 1].r = feeds[src]; used.add(src); used.add(feeds[src]);
        }
      }
      if (style === 'usual') for (const h of habits) {
        if (h && !days[h.day].r && !used.has(h.r) && rng() < h.n / h.of) { days[h.day].r = h.r; used.add(h.r); }
      }
      for (const i of free()) {
        if (days[i].r) continue; // taken meanwhile by a second night
        const pool = dinners.filter((id) => !used.has(id) && !needs[id]);
        if (!pool.length) break;
        let id;
        if (style === 'usual') {
          const weights = pool.map((p) => 1 + 3 * (planned[p] || 0) + 6 * (byDay[i][p] || 0));
          let x = rng() * weights.reduce((a, b) => a + b, 0);
          id = pool.find((p, k) => (x -= weights[k]) < 0);
        } else if (style === 'wild') {
          const fresh = pool.filter((p) => !planned[p]);
          id = pick(fresh.length && rng() < 0.85 ? fresh : pool);
        } else id = pick(pool);
        days[i].r = id || pool[0]; used.add(days[i].r);
        const r = R[days[i].r];
        if (r.b && rng() < 0.6) { // batch cook: its second night is free
          const later = free().filter((j) => j > i + 1);
          if (later.length) { const j = later[0]; days[j] = { r: days[i].r, d: null, lock: false, second: true }; }
        }
      }
      if (style === 'thrifty' && t % 20 === 0) improve(week, days);
      const candidate = { ...week, days };
      const score = scoreWeek(candidate, style) + rng() * (style === 'thrifty' ? 0.5 : 3);
      if (!best || score > best.score) best = { days, score };
    }
    const dealt = { ...week, days: best.days };
    return { week: dealt, why: explain(dealt, style) };
  }

  // Thrifty only: swap single dinners for ones that shorten the shop, until nothing helps.
  function improve(week, days) {
    const fixed = (s) => s.lock || s.second || needs[s.r] || feeds[s.r] || E_R(s.r).b;
    let now = scoreWeek({ ...week, days }, 'thrifty');
    for (let pass = 0; pass < 3; pass++) {
      let changed = false;
      for (let i = 0; i < 7; i++) {
        if (!days[i].r || fixed(days[i])) continue;
        const used = new Set(days.map((s) => s.r));
        for (const id of dinners) {
          if (used.has(id) || needs[id] || R[id].b) continue;
          const old = days[i].r;
          days[i].r = id;
          const next = scoreWeek({ ...week, days }, 'thrifty');
          if (next > now + 1e-9) { now = next; used.delete(old); used.add(id); changed = true; } else days[i].r = old;
        }
      }
      if (!changed) break;
    }
  }
  const E_R = (id) => R[id] || {};

  function scoreWeek(week, style) {
    let score = 0;
    const proteins = {};
    let slow = 0;
    week.days.forEach((s, i) => {
      if (!s.r || s.second) return;
      const r = R[s.r];
      proteins[r.pr] = (proteins[r.pr] || 0) + 1;
      if ((r.tg || []).includes('slow')) { slow++; if (i <= 1) score += 2; }
    });
    for (const n of Object.values(proteins)) if (n > 2) score -= 8 * (n - 2);
    if (proteins.sea) score += 3;
    if (slow > 2) score -= 6 * (slow - 2);
    const st = stats(week);
    if (style === 'thrifty') score += st.saved * 4 - st.mealItems;
    else score += st.saved * 0.8;
    if (style === 'wild') score += Object.keys(proteins).length * 2;
    return score;
  }

  function explain(week, style) {
    const st = stats(week), ins = insights(week);
    const bits = [];
    if (style === 'usual') {
      const kept = ins.habitNotes.map((h) => `${R[h.r].n.toLowerCase()} on ${DAY_NAMES[h.day]}`);
      bits.push(kept.length ? `A week like your saved ones: ${kept.slice(0, 2).join(', ')}.` : 'A week weighted toward what you have planned before.');
    } else if (style === 'thrifty') {
      bits.push(`Dealt for a short shop: ${st.mealItems} things to buy for seven dinners.`);
    } else {
      const fresh = week.days.filter((s) => s.r && !planned[s.r]).length;
      bits.push(`${fresh} dinners that are in none of your saved plans.`);
    }
    if (ins.chains.length) bits.push(`${DAY_NAMES[ins.chains[0].from]}'s ${R[ins.chains[0].source].n.toLowerCase()} becomes ${DAY_NAMES[ins.chains[0].to]}'s lasagne.`);
    if (st.saved > 0 && style !== 'thrifty') bits.push(`${st.saved} ${st.saved === 1 ? 'item is' : 'items are'} shared between meals.`);
    else if (st.saved > 0) bits.push(`Sharing saves ${st.saved} ${st.saved === 1 ? 'line' : 'lines'}.`);
    return bits.join(' ');
  }

  // ---- placing cards ----------------------------------------------------------------------
  // Returns a new week. from: {deck:id} | {day:i}; to: {day:i} | {deck:true} | {extras:true}
  function move(week, from, to) {
    const w = { ...week, days: week.days.map((s) => ({ ...s })), extras: [...week.extras] };
    const blank = () => ({ r: null, d: null, lock: false, second: false });
    const clearSeconds = (id) => w.days.forEach((s, i) => { if (s.second && s.r === id) w.days[i] = blank(); });
    if (from.day != null && to.day != null) {
      if (from.day === to.day) return w;
      [w.days[from.day], w.days[to.day]] = [w.days[to.day], w.days[from.day]];
      for (const s of w.days) s.lock = false;
      // A second night that lands before its cook night swaps roles with it.
      w.days.forEach((s, i) => {
        if (!s.second) return;
        const cook = w.days.findIndex((x) => x.r === s.r && !x.second);
        if (cook > i) { w.days[cook].second = true; s.second = false; }
        if (cook === -1) s.second = false;
      });
    } else if (from.deck && to.day != null) {
      const old = w.days[to.day];
      if (old.r && !old.second) clearSeconds(old.r);
      if (R[from.deck].k !== 'dinner' && R[from.deck].k !== 'side') { if (!w.extras.includes(from.deck)) w.extras.push(from.deck); return w; }
      const dup = w.days.findIndex((s) => s.r === from.deck && !s.second);
      if (dup !== -1 && dup !== to.day) { clearSeconds(from.deck); w.days[dup] = blank(); }
      w.days[to.day] = { r: from.deck, d: null, lock: false, second: false };
    } else if (from.day != null && to.deck) {
      const old = w.days[from.day];
      if (old.r && !old.second) clearSeconds(old.r);
      w.days[from.day] = blank();
    } else if (from.deck && to.extras) {
      if (!w.extras.includes(from.deck)) w.extras.push(from.deck);
    }
    return w;
  }

  function addSecondNight(week, day) {
    const w = { ...week, days: week.days.map((s) => ({ ...s })) };
    const id = w.days[day].r;
    let j = w.days.findIndex((s, i) => i > day + 1 && !s.r);
    if (j === -1) j = w.days.findIndex((s, i) => i > day && !s.r);
    if (j === -1) return null;
    w.days[j] = { r: id, d: null, lock: false, second: true };
    return w;
  }

  // ---- week code for the link -------------------------------------------------------------
  function encode(week) {
    return 'w-' + week.days.map((s) => (s.r ? recipeIds.indexOf(s.r).toString(36).padStart(2, '0') : 'zz')).join('') + week.days.map((s) => (s.second ? '1' : '0')).join('');
  }
  function decode(code, week) {
    const m = /^w-([0-9a-z]{14})([01]{7})?$/.exec(code || '');
    if (!m) return null;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const pair = m[1].slice(i * 2, i * 2 + 2);
      const id = pair === 'zz' ? null : recipeIds[parseInt(pair, 36)];
      days.push({ r: id || null, d: null, lock: false, second: !!id && !!m[2] && m[2][i] === '1' });
    }
    return { ...week, days };
  }

  // ---- writing back to Iris ---------------------------------------------------------------
  function toIris(week, ticked = new Set()) {
    const a = dayDate(week.start, 0);
    const heading = (i) => { const d = dayDate(week.start, i); return `## ${DAY_NAMES[i]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`; };
    const dayLine = (s) => {
      if (!s.r) return '- _(nothing planned)_';
      if (s.second) return `- ${R[s.r].n} _(second night, already cooked)_`;
      const diners = s.d && s.d !== R[s.r].sv ? ` _(for ${s.d})_` : '';
      return `- {{diagram:${s.r}:name}}${diners}`;
    };
    // Same shape as the saved plans: the weekend, then the working week.
    const plan = ['# Week 1:'];
    week.days.forEach((s, i) => {
      if (i === 2) plan.push('# Week 2:');
      plan.push(heading(i), dayLine(s), '');
    });
    if (week.extras.length) plan.push('# Extras', ...week.extras.map((id) => `- {{diagram:${id}:name}}`), '');
    const s = shop(week);
    const range = rangeLabel(week.start);
    const meals = week.days.map((x, i) => (x.r ? `${DAY_SHORT[i]} ${R[x.r].n.toLowerCase()}` : null)).filter(Boolean).join(', ');
    const list = [`Shopping list for ${range}, dealt in Dinner Deck. ${meals}.`, ''];
    const section = (title, lines) => {
      if (!lines.length) return;
      list.push(`## ${title}`, '');
      for (const l of lines) {
        const from = [...new Set(l.parts.map((p) => p.label.toLowerCase()))];
        if (l.weekly) from.push('every week');
        const why = from.length ? ` _(${from.join(', ')})_` : '';
        list.push(`- [${ticked.has(l.g) ? 'x' : ' '}] ${l.qty ? l.qty + ' ' : ''}{{element:${l.g}:name}}${why}`);
      }
      list.push('');
    };
    deck.aisles.forEach((name, i) => section(name, s.lines.filter((l) => l.aisle === i && l.tier !== 'cupboard')));
    section('Check the cupboard', s.lines.filter((l) => l.tier === 'cupboard'));
    return {
      packageName: a.toISOString().slice(0, 10),
      planName: `From ${range}`,
      planDescription: meals + '.',
      planMarkdown: plan.join('\n').trim(),
      listName: `Shopping list ${range}`,
      listDescription: `Shopping list for the ${range} meal plan, made in Dinner Deck. Grouped by aisle in store order.`,
      listMarkdown: list.join('\n').trim(),
    };
  }

  return { G, R, recipeIds, dinners, needs, feeds, planned, habits, shop, insights, stats, deal, move, addSecondNight, encode, decode, toIris, STYLES, unitOf };
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'svg') el.innerHTML = v; // static markup defined in this file only
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

// ---------------------------------------------------------------- recipe sheet
const sheet = $('sheet');
function openSheet(nodes) { $('sheet-inner').replaceChildren(...nodes); if (!sheet.open) (sheet.showModal ? sheet.showModal() : sheet.setAttribute('open', '')); }
function closeSheet() { sheet.open && sheet.close ? sheet.close() : sheet.removeAttribute('open'); }
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*)/).filter(Boolean).map((part) => (part.startsWith('**') ? h('strong', { text: part.slice(2, -2) }) : part));
}
function openRecipe(id, dayHint) {
  const r = R[id];
  const at = dayHint != null ? dayHint : dayOf(id);
  const slot = at !== -1 ? S.week.days[at] : null;
  const rows = [];
  let sec = null;
  for (const ing of r.i) {
    if ((ing.h || '') !== (sec || '')) { sec = ing.h || ''; if (sec) rows.push(h('li', { class: 'sec', text: sec })); }
    const g = G[ing.g], unit = E.unitOf(ing);
    const extra = [ing.t, ing.o && 'optional', ing.alt && `or ${G[ing.alt].n.toLowerCase()}`, ing.odd && 'this amount looks wrong in Iris'].filter(Boolean).join(', ');
    rows.push(h('li', { class: 'q', text: ing.q != null ? formatQty(ing.q, unit) : '' }), h('li', { class: 'n' }, g.n, extra && h('small', { text: ` (${extra})` })));
  }
  for (const x of r.x || []) rows.push(h('li', { class: 'q' }), h('li', { class: 'n', text: x }));
  const steps = [], paras = [], after = [];
  for (const line of (r.m || '').split('\n').map((s) => s.trim()).filter(Boolean)) {
    const m = /^\d+\.\s+(.*)$/.exec(line);
    if (m) steps.push(h('li', null, inline(m[1])));
    else if (line.startsWith('#')) after.push(h('h3', { text: line.replace(/^#+\s*/, '') }));
    else if (line.startsWith('- ')) after.push(h('p', null, '• ', inline(line.slice(2))));
    else (steps.length ? after : paras).push(h('p', null, inline(line)));
  }
  const facts = [`Serves ${r.sv}`, PIP_NAMES[r.pr].toLowerCase(), ...(r.tg || []), r.k !== 'dinner' && KIND_LABEL[r.k], E.planned[id] && `in ${E.planned[id]} of ${DECK.plans.length} saved weeks`].filter(Boolean).join(' · ');
  const isDinner = r.k === 'dinner' || r.k === 'side';
  const puton = isDinner ? h('div', { class: 'puton', role: 'group', 'aria-label': 'Put on a day' }, DAY_SHORT.map((d, i) => h('button', {
    type: 'button', class: i === at ? 'here' : '', text: d, 'aria-label': `Put on ${DAY_NAMES[i]}`, 'aria-pressed': String(i === at),
    onclick: () => { const w = at !== -1 ? E.move(S.week, { day: at }, { day: i }) : E.move(S.week, { deck: id }, { day: i }); S.pickDay = null; closeSheet(); commit(w, ''); toast(`${r.n} is on ${DAY_NAMES[i]}.`); },
  }))) : h('div', { class: 'puton' }, h('button', { type: 'button', text: S.week.extras.includes(id) ? 'In this week’s extras' : 'Add to this week’s extras', onclick: () => { closeSheet(); commit(E.move(S.week, { deck: id }, { extras: true })); toast(`${r.n} added to extras.`); } }));
  const body = [
    r.d && h('p', { text: r.d }),
    h('p', { class: 'fine', text: facts }),
    h('div', null, h('h3', { text: isDinner ? 'Put it on' : 'This week' }), h('div', { style: 'margin-top:6px' }, puton)),
    slot && !slot.second && h('div', null, h('h3', { text: 'Eating' }), h('div', { class: 'stepper', style: 'margin-top:6px' },
      h('button', { type: 'button', text: '−', 'aria-label': 'One fewer', onclick: () => setDiners(at, -1, id) }),
      h('output', { id: 'diners', text: String(slot.d || r.sv) }),
      h('button', { type: 'button', text: '+', 'aria-label': 'One more', onclick: () => setDiners(at, 1, id) }),
      h('span', { class: 'fine', text: `The recipe serves ${r.sv}. The shop scales to match.` }))),
    h('div', null, h('h3', { text: 'Ingredients' }), h('ul', { class: 'ing' }, rows)),
    (steps.length || paras.length) ? [h('div', null, h('h3', { text: 'Method' }), paras, steps.length ? h('ol', { class: 'method' }, steps) : null), after.length ? h('div', { class: 'after' }, after) : null] : h('p', { class: 'fine', text: 'No method is written down in Iris for this one.' }),
  ];
  openSheet([
    h('div', { class: 'sheet-head' }, pip(r.pr), h('h2', { text: r.n, id: 'sheet-title' }), h('button', { class: 'close', type: 'button', text: '×', 'aria-label': 'Close', onclick: closeSheet })),
    h('div', { class: 'sheet-body' }, body),
    h('div', { class: 'sheet-foot' },
      h('a', { href: `${DECK.iris.base}/views/${id}`, target: '_blank', rel: 'noopener', text: 'Open in Iris' }),
      slot && h('button', { class: 'ghost', type: 'button', style: 'margin-left:auto', text: 'Take off the table', onclick: () => { closeSheet(); commit(E.move(S.week, { day: at }, { deck: true }), ''); } })),
  ]);
}
function setDiners(day, delta, id) {
  const slot = S.week.days[day], r = R[id];
  const d = Math.max(1, Math.min(16, (slot.d || r.sv) + delta));
  S.week = { ...S.week, days: S.week.days.map((s, k) => (k === day ? { ...s, d: d === r.sv ? null : d } : s)) };
  touched(); renderAll();
  const out = $('diners'); if (out) out.textContent = String(d);
}

// ---------------------------------------------------------------- copy, share, save to Iris
async function copy(text, okMessage) {
  try { await navigator.clipboard.writeText(text); toast(okMessage); return true; } catch { return false; }
}
function copyList() {
  const lines = [`Shopping, ${rangeLabel(S.start)}`];
  DECK.aisles.forEach((name, a) => {
    const ls = toBuy().filter((l) => l.aisle === a && !S.ticks.has(l.g));
    if (ls.length) lines.push('', name.toUpperCase(), ...ls.map((l) => `- ${l.name}${l.qty ? ' ' + l.qty : ''}`));
  });
  const text = lines.join('\n');
  copy(text, 'List copied.').then((ok) => { if (!ok) showText('Copy the list', text); });
}
function showText(title, text, note) {
  const ta = h('textarea', { class: 'copy', readonly: true, id: 'copy-text', 'aria-label': title });
  ta.value = text;
  openSheet([
    h('div', { class: 'sheet-head' }, h('h2', { text: title }), h('button', { class: 'close', type: 'button', text: '×', 'aria-label': 'Close', onclick: closeSheet })),
    h('div', { class: 'sheet-body' }, note && h('p', { text: note }), ta),
  ]);
  ta.focus(); ta.select();
}
function shareWeek() {
  const code = E.encode(S.week);
  try { history.replaceState(null, '', '#' + code); } catch { location.hash = code; }
  if (window.claude) toast('This week is now in the page link. Use Share, then Copy link.');
  else copy(location.href, 'Link to this week copied.').then((ok) => { if (!ok) showText('Link to this week', location.href); });
}

const FIX = {
  server_not_connected: 'Iris is not connected for you. Add it in claude.ai under Settings, Connectors, then try again.',
  needs_reauth: 'Your Iris sign-in has lapsed. Reconnect Iris in claude.ai under Settings, Connectors, then try again.',
  selection_required: 'You have more than one Iris connector. Choose one in claude.ai when asked, then try again.',
  not_in_manifest: 'Iris is switched off for this page. Allow it in this page’s Permissions menu, then try again.',
  consent_required: 'Iris has not been allowed for this page. Press the button again and choose Allow.',
  approval_required: 'Writing to Iris needs your approval. Press the button again and choose Allow.',
  blocked_by_policy: 'Your organisation does not allow this page to write to Iris.',
  not_granted: 'This view cannot reach Iris.', capability_disabled: 'This view cannot reach Iris.',
};
function irisError(e, wrote) {
  const code = e && e.code;
  if (code === 'tool_error' && /auth|sign.?in|401|unauthor/i.test(e.message || '')) return 'Iris wants you signed in before it will save. In claude.ai go to Settings, Connectors, Iris and press Connect, then try again.';
  if (code === 'tool_error') return `Iris refused: ${String(e.message || '').slice(0, 200)}`;
  if (FIX[code]) return FIX[code];
  return wrote || code === 'server_unavailable' || code === 'upstream_error'
    ? 'Iris did not answer in time. Something may have been written. Check Iris before trying again.'
    : 'Could not reach Iris just now. Nothing was written.';
}
async function openSave() {
  const out = E.toIris(S.week, S.ticks);
  const empty = S.week.days.every((s) => !s.r);
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await Promise.race([window.claude.use('mcp'), new Promise((r) => setTimeout(() => r(null), 4000))]) : null; } catch { mcp = null; }
  const status = h('div', { id: 'save-status', role: 'status', hidden: true });
  const goBtn = h('button', { class: 'go', type: 'button', style: 'flex:0 1 auto;padding:0 18px', text: 'Write both to Iris', disabled: empty || !mcp || null });
  const say = (text, ok) => { status.hidden = false; status.className = 'status' + (ok ? ' ok' : ''); status.replaceChildren(...(Array.isArray(text) ? text : [text])); };
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true; say('Writing to Iris…', true);
    let wrote = false;
    try {
      const made = [];
      for (const job of [
        { set: DECK.iris.mealPlansSet, name: out.planName, description: out.planDescription, md: out.planMarkdown },
        { set: DECK.iris.shoppingListsSet, name: out.listName, description: out.listDescription, md: out.listMarkdown },
      ]) {
        const tree = (await mcp.callTool(IRIS, 'package_hierarchy', { set_id: job.set }, { cache: false })).payload;
        const nodes = Array.isArray(tree) ? tree : (tree && (tree.result || tree.packages)) || [];
        let pkg = nodes.find((n) => n && n.name === out.packageName);
        if (!pkg) { pkg = (await mcp.callTool(IRIS, 'create_package', { name: out.packageName, set_id: job.set })).payload; wrote = true; }
        const res = (await mcp.callTool(IRIS, 'create_diagram', { set_id: job.set, name: job.name, description: job.description, diagram_type: 'smart_markdown', notation: 'markdown', parent_package_id: pkg && pkg.id, data: { markdown_source: job.md } })).payload;
        wrote = true;
        if (res && res.error) throw { code: 'tool_error', message: String(res.message || res.error) };
        made.push({ name: job.name, url: res && res.web_url });
      }
      say(['Saved. ', ...made.flatMap((m, i) => [i ? ' and ' : '', m.url ? h('a', { href: m.url, target: '_blank', rel: 'noopener', text: m.name }) : m.name]), ' are in Iris.'], true);
      toast('Saved to Iris.');
    } catch (e) { say(irisError(e, wrote), false); goBtn.disabled = false; }
  });
  openSheet([
    h('div', { class: 'sheet-head' }, h('h2', { text: 'Save this week to Iris' }), h('button', { class: 'close', type: 'button', text: '×', 'aria-label': 'Close', onclick: closeSheet })),
    h('div', { class: 'sheet-body' },
      h('p', { text: empty ? 'There is nothing on the table to save yet.' : 'Two new things will be written. Nothing existing is changed.' }),
      h('ul', { class: 'dest' },
        h('li', null, h('b', { text: out.planName }), h('small', { text: `A meal plan in Weekly meal plans, package ${out.packageName}. Same shape as your saved plans, so Iris can still add it up.` })),
        h('li', null, h('b', { text: out.listName }), h('small', { text: `A checklist in Shopping lists, package ${out.packageName}. ${toBuy().length} items in store order, ticks included.` }))),
      !mcp && h('p', { class: 'status', text: window.claude ? 'This view cannot reach your Iris connector. Copy the markdown instead and paste it into a new Iris document.' : 'Saving straight to Iris works when this page is opened in Claude, where it can use your Iris connector. Here you can copy the markdown and paste it into Iris.' }),
      status),
    h('div', { class: 'sheet-foot' }, goBtn,
      h('button', { class: 'ghost', type: 'button', text: 'Copy the plan', onclick: () => copy(out.planMarkdown, 'Meal plan markdown copied.').then((ok) => { if (!ok) showText(out.planName, out.planMarkdown); }) }),
      h('button', { class: 'ghost', type: 'button', text: 'Copy the list', onclick: () => copy(out.listMarkdown, 'Shopping list markdown copied.').then((ok) => { if (!ok) showText(out.listName, out.listMarkdown); }) })),
  ]);
}

// ---------------------------------------------------------------- dealing
function dealNow() {
  const before = S.week.days.map((s) => s.r + (s.second ? '2' : ''));
  const { week, why } = E.deal(S.week, S.style);
  S.pickDay = null;
  commit(week, why);
  if (reduceMotion) return;
  const from = $('deal').getBoundingClientRect();
  document.querySelectorAll('#days .day').forEach((li, i) => {
    const card = li.querySelector('.dcard');
    if (!card || before[i] === week.days[i].r + (week.days[i].second ? '2' : '')) return;
    const to = card.getBoundingClientRect();
    const dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.top + from.height / 2 - (to.top + to.height / 2);
    card.animate([
      { transform: `translate(${dx}px, ${dy}px) rotate(${i % 2 ? 9 : -9}deg) scale(.35)`, opacity: 0 },
      { opacity: 1, offset: 0.25 },
      { transform: 'none', opacity: 1 },
    ], { duration: 460, delay: i * 75, easing: 'cubic-bezier(.2,.9,.25,1.05)', fill: 'backwards' });
  });
}

// ---------------------------------------------------------------- drag (mouse and pen; touch uses taps)
let drag = null, swallowClick = false;
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const src = e.target.closest('[data-drag]');
  if (!src || e.target.closest('.tools, .threads')) return;
  drag = { src, x: e.clientX, y: e.clientY, ghost: null, over: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const rect = drag.src.getBoundingClientRect();
    const g = drag.src.cloneNode(true);
    g.classList.add('ghostcard'); g.style.width = Math.min(rect.width, 340) + 'px';
    drag.dx = Math.min(e.clientX - rect.left, 300); drag.dy = e.clientY - rect.top;
    document.body.append(g); document.body.classList.add('dragging');
    drag.ghost = g; drag.src.style.opacity = '.35';
  }
  drag.ghost.style.left = e.clientX - drag.dx + 'px'; drag.ghost.style.top = e.clientY - drag.dy + 'px';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el && (el.closest('[data-drop-day]') || el.closest('#extras') || (drag.src.dataset.drag === 'day' && el.closest('.deck')));
  if (target !== drag.over) { drag.over && drag.over.classList.remove('over'); target && target.classList.add('over'); drag.over = target || null; }
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.ghost) return;
  d.ghost.remove(); d.src.style.opacity = ''; document.body.classList.remove('dragging');
  d.over && d.over.classList.remove('over');
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
  if (cancel || !d.over) return;
  const id = d.src.dataset.id, fromDay = d.src.dataset.drag === 'day' ? Number(d.src.dataset.day) : null;
  if (d.over.dataset.dropDay != null) {
    const to = Number(d.over.dataset.dropDay);
    if (fromDay != null) commit(E.move(S.week, { day: fromDay }, { day: to }), '');
    else place(id, to);
  } else if (d.over.id === 'extras' && fromDay == null) commit(E.move(S.week, { deck: id }, { extras: true }));
  else if (fromDay != null) commit(E.move(S.week, { day: fromDay }, { deck: true }), '');
}
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => endDrag(true));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { endDrag(true); if (S.pickDay != null) { S.pickDay = null; renderDeck(); renderWeek(); } } });
document.addEventListener('click', (e) => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);

// ---------------------------------------------------------------- toast
let toastTimer = 0;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------------------------------------------------------------- wiring
$('search').addEventListener('input', (e) => { S.q = e.target.value.trim(); renderDeck(); });
$('filters').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { S.filter = b.dataset.f; renderDeck(); } });
$('pick-cancel').addEventListener('click', () => { S.pickDay = null; renderDeck(); renderWeek(); if (isPhone()) setView('week'); });
$('styles').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.style = b.dataset.s; persist(); renderWeek(); } });
$('deal').addEventListener('click', dealNow);
$('clear').addEventListener('click', () => commit({ ...emptyWeek(S.start), adds: S.week.adds, everyWeek: S.week.everyWeek }, 'Table cleared.'));
function shiftWeek(by) { const d = dayDate(S.start, by * 7); loadWeek(d.toISOString().slice(0, 10)); shownCount = null; subscribe(); renderAll(); }
$('prev').addEventListener('click', () => shiftWeek(-1));
$('next').addEventListener('click', () => shiftWeek(1));
$('every-week').addEventListener('change', (e) => commit({ ...S.week, everyWeek: e.target.checked }));
$('add').addEventListener('input', () => { sugCur = 0; renderSuggest(); });
$('add').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { sugCur = Math.min(sugCur + 1, sugIds.length - 1); renderSuggest(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sugCur = Math.max(sugCur - 1, 0); renderSuggest(); e.preventDefault(); }
  else if (e.key === 'Enter' && sugIds[sugCur]) { addItem(sugIds[sugCur]); e.preventDefault(); }
  else if (e.key === 'Escape') { e.target.value = ''; renderSuggest(); }
});
$('add').addEventListener('blur', () => setTimeout(() => { if (document.activeElement && document.activeElement.closest('#suggest')) return; $('suggest').hidden = true; }, 150));
$('add').addEventListener('focus', renderSuggest);
$('save').addEventListener('click', openSave);
$('copy').addEventListener('click', copyList);
$('share').addEventListener('click', shareWeek);
$('untick').addEventListener('click', () => { S.ticks.clear(); touched(); renderShop(); renderTabs(); });
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setView(b.dataset.v));
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });

loadWeek(S.start);
const fromLink = E.decode(location.hash.slice(1), S.week);
if (fromLink) { S.week = fromLink; S.why = 'This week came from the link.'; S.ticks = new Set(); S.rev = Date.now(); persist(); }
$('deck-sub').textContent = `${E.recipeIds.length} recipes · ${Object.keys(G).length} groceries · ${DECK.aisles.length} aisles`;
renderAll();
initCloud();

</script>
