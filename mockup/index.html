<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinner Deck mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root { --ground:#F2F6F1; --ink:#16241B; --muted:#4B5E51; --line:#D5DFD5; --green:#1F7A4D; --rust:#9A3412; --rust-bg:#FFF1E8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DDE4DC; font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); }
  .frame { width: 1280px; height: 800px; margin: 24px auto; background: var(--ground); display: flex; }
  h1, h2 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; }
  h1 { font-weight: 800; font-size: 32px; line-height: 1; }
  h2 { font-weight: 600; font-size: 22px; }
  .small { font-size: 13px; color: var(--muted); }
  .deck { width: 290px; padding: 28px 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--line); }
  .deck label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .deck input { min-height: 44px; border: 1px solid #B9C7BB; border-radius: 10px; padding: 0 12px; font: 400 14px 'DM Sans', sans-serif; background: #fff; color: var(--ink); }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 0 var(--line); font-weight: 500; font-size: 14px; }
  .primary { margin-top: auto; min-height: 48px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: 700 15px 'DM Sans', sans-serif; }
  .week { flex: 1; min-width: 0; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .days { display: flex; flex-direction: column; gap: 8px; }
  .day { display: flex; align-items: stretch; gap: 12px; }
  .day .d { width: 44px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; color: var(--muted); display: flex; align-items: center; }
  .day .m { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 0 var(--line); }
  .day .m b { display: block; font-size: 15px; }
  .day .m span { font-size: 12.5px; color: var(--muted); }
  .chain { margin-top: auto; background: var(--rust-bg); border: 1px solid #F0C4AA; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.4; color: #5A2410; }
  .shop { width: 370px; background: #fff; border-left: 1px solid var(--line); padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 12px; }
  .aisle { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--green); margin-bottom: 4px; }
  .items { display: flex; flex-wrap: wrap; gap: 6px; }
  .items label { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px 0 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; background: #F7FAF6; }
  .items input { width: 16px; height: 16px; margin: 0; accent-color: var(--green); }
  .tag { font-size: 11px; font-weight: 700; color: var(--rust); background: var(--rust-bg); border-radius: 4px; padding: 1px 5px; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .secondary { min-height: 44px; border: 1px solid var(--green); border-radius: 12px; background: #fff; color: var(--green); font: 700 14px 'DM Sans', sans-serif; }
</style>
</head>
<body>
<main class="frame">
  <section class="deck" aria-label="Recipe deck">
    <div>
      <h1>Dinner Deck</h1>
      <div class="small">43 recipes · 216 groceries · 13 aisles</div>
    </div>
    <label>Find a meal <input type="text" placeholder="salmon, one pot, Tata…"></label>
    <div class="cards" id="deck"></div>
    <button class="primary">Deal me a week</button>
  </section>

  <section class="week" aria-label="This week">
    <div class="row"><h2>This week</h2><div class="small">Drag a card to swap. The list on the right keeps up.</div></div>
    <div class="days" id="week"></div>
    <div class="chain"><b>Leftover chain found.</b> Saturday's pork shoulder becomes Sunday's lasagne. One cook, two dinners.</div>
  </section>

  <section class="shop" aria-label="Shopping list">
    <div class="row"><h2>The shop</h2><div class="small">in aisle order</div></div>
    <div id="shop" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="foot">
      <div class="small">Mockup: list shortened. Quantities come from each recipe.</div>
      <button class="secondary">Save as a shopping list in Iris</button>
    </div>
  </section>
</main>
<script>
  // Static mockup data. Recipe names are real. Shopping items are inferred from recipe titles, not read from Iris.
  var deck = ['Prawn fettuccini', 'Baked salmon', 'Tacos', 'Shepherds pie', 'Chilli con carne', 'Egg Pie', 'Pikelets'];
  var week = [
    ['Mon', 'Mild chicken, kumara and coconut curry', 'One pot, served on rice'],
    ['Tue', 'Creamy garlic mussels with broccoli and crusty bread', 'Green-lipped mussels'],
    ['Wed', 'Sausages with coleslaw and potatoes', 'Pulls in the Coleslaw recipe'],
    ['Thu', 'Gołąbki', 'Shares its cabbage with Wednesday'],
    ['Fri', 'Fish pie a la Tata', 'Friday fish'],
    ['Sat', 'Slow cooked pork shoulder', 'Cook once'],
    ['Sun', 'Lasagne from leftover pork shoulder', 'Eat twice']
  ];
  var aisles = [
    ['Produce', ['Kumara', 'Carrot*', 'Cabbage*', 'Capsicum', 'Broccoli', 'Potatoes', 'Garlic']],
    ['Meat & Poultry', ['Chicken breast', 'Sausages', 'Pork shoulder']],
    ['Chilled', ['Mussels', 'Cream', 'Parmesan']],
    ['Pantry', ['Coconut cream', 'Rice', 'Mayonnaise']],
    ['Bakery', ['Crusty bread']]
  ];
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  deck.forEach(function (n) { document.getElementById('deck').appendChild(el('div', 'card', n)); });
  week.forEach(function (w) {
    var row = el('div', 'day'); row.appendChild(el('div', 'd', w[0]));
    var m = el('div', 'm'); m.appendChild(el('b', '', w[1])); m.appendChild(el('span', '', w[2]));
    row.appendChild(m); document.getElementById('week').appendChild(row);
  });
  aisles.forEach(function (a) {
    var box = el('div'); box.appendChild(el('div', 'aisle', a[0]));
    var items = el('div', 'items');
    a[1].forEach(function (name) {
      var shared = name.slice(-1) === '*'; if (shared) name = name.slice(0, -1);
      var l = el('label'); var c = el('input'); c.type = 'checkbox'; l.appendChild(c);
      l.appendChild(document.createTextNode(name));
      if (shared) l.appendChild(el('span', 'tag', '2 meals'));
      items.appendChild(l);
    });
    box.appendChild(items); document.getElementById('shop').appendChild(box);
  });
</script>
</body>
</html>
